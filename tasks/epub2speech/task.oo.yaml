inputs_def:
  - handle: epub_path
    description: "%path-to-the-epub-file-to-convert%"
    json_schema:
      type: string
      ui:widget: file
      ui:options:
        filters:
          - name: EPUB
            extensions:
              - epub
        excludeAll: true
    nullable: false

  - handle: voice
    description: "%tts-voice-model-oomol-qwen-tts%"
    json_schema:
      type: string
      enum:
        - Cherry
        - Serena
        - Ethan
        - Chelsie
        - Momo
        - Vivian
        - Moon
        - Maia
        - Kai
        - Nofish
        - Bella
        - Jennifer
        - Ryan
        - Katerina
        - Aiden
        - Eldric Sage
        - Mia
        - Mochi
        - Bellona
        - Vincent
        - Bunny
        - Neil
        - Elias
        - Arthur
        - Nini
        - Ebona
        - Seren
        - Pip
        - Stella
        - Bodega
        - Sonrisa
        - Alek
        - Dolce
        - Sohee
        - Ono Anna
        - Lenn
        - Emilien
        - Andre
        - Radio Gol
        - Jada
        - Dylan
        - Li
        - Marcus
        - Roy
        - Peter
        - Sunny
        - Eric
        - Rocky
        - Kiki
    value: Cherry
    nullable: false

  - group: optional
    collapsed: true

  - handle: output_filename
    description: "%output-filename-without-extension-optional-default-audiobook%"
    json_schema:
      type: string
    value:
    nullable: true

  - handle: max_chunk_length
    description: "%maximum-text-length-per-tts-request-in-characters-optional-defau%"
    json_schema:
      type: number
    value:
    nullable: true

outputs_def:
  - handle: audiobook_path
    description: "%path-to-the-generated-audiobook-file%"
    json_schema:
      type: string
      ui:widget: save
      ui:options:
        filters:
          - name: M4B
            extensions:
              - m4b
        excludeAll: true

executor:
  name: python
  options:
    entry: __init__.py
    spawn: false

title: "%epub-to-speech%"
icon: ":carbon:book:"
description: "%convert-epub-e-books-into-audio-using-oomol-tts-extracts-chapter%"
long_running: true
